<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#11151c">
<title>AION2 利益ファインダー</title>
<style>
:root{
  --bg:#11151c; --panel:#1a2029; --panel2:#222a35; --line:#2e3846; --text:#e6ebf2; --sub:#9aa6b6;
  --gold:#e8c26a; --up:#5fd38d; --down:#ff7a7a; --blue:#78b4ff; --warn:#f0a95a;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif}
body.lock{overflow:hidden}
header{position:sticky;top:0;z-index:5;background:rgba(17,21,28,.96);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);padding:10px 12px 0;padding-top:max(10px,env(safe-area-inset-top))}
.top{display:flex;gap:8px;align-items:center}
h1{font-size:16px;margin:0;color:var(--gold);white-space:nowrap}
select,input,button,textarea{font:inherit;color:var(--text);background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:7px 9px}
input,textarea{width:100%}
button{cursor:pointer}
button.primary{background:var(--gold);color:#1a1405;border-color:var(--gold);font-weight:600}
.top select{margin-left:auto;max-width:55%}
.meta{font-size:12px;color:var(--sub);margin:4px 0 6px}
nav{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;margin:0 -12px;padding:0 12px}
nav::-webkit-scrollbar{display:none}
nav button{flex:none;border:0;border-radius:8px 8px 0 0;background:transparent;color:var(--sub);padding:8px 11px;white-space:nowrap}
nav button.on{background:var(--panel);color:var(--gold);font-weight:600}
main{padding:10px 12px 40px;max-width:760px;margin:0 auto}
.bar{display:flex;gap:8px;margin-bottom:10px;align-items:center}
.bar>*{flex:1}
.hint{font-size:12.5px;color:var(--sub);margin:0 0 10px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.card.fav{border-color:#6b5a2c}
.tap{cursor:pointer}
.row{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.name{font-weight:600;line-height:1.35}
.cat{font-size:12px;color:var(--sub)}
.big{font-size:18px;font-weight:700;white-space:nowrap}
.grid{display:grid;grid-template-columns:1fr auto;gap:2px 12px;font-size:13.5px;margin-top:6px}
.grid>span:nth-child(odd){color:var(--sub)}
.grid>span:nth-child(even){text-align:right;font-variant-numeric:tabular-nums}
.up{color:var(--up)} .down{color:var(--down)} .gold{color:var(--gold)}
.tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.tag{font-size:11.5px;padding:1px 7px;border-radius:99px;background:var(--panel2);color:var(--sub);border:1px solid var(--line)}
.tag.good{color:var(--up);border-color:#2f6a48} .tag.bad{color:var(--down);border-color:#7a3a3a} .tag.warn{color:var(--warn);border-color:#7a5a2f} .tag.gold{color:var(--gold);border-color:#6b5a2c}
.tr{font-size:10.5px;color:var(--sub);border:1px solid var(--line);border-radius:4px;padding:0 4px;margin-left:4px;vertical-align:2px;font-weight:400}
svg.spark{width:100%;height:34px;margin-top:6px;display:block}
.empty{color:var(--sub);text-align:center;padding:30px 10px}
table{width:100%;border-collapse:collapse;font-size:13.5px}
td,th{padding:6px 4px;border-bottom:1px solid var(--line);text-align:right;vertical-align:top}
td:first-child,th:first-child{text-align:left}
th{color:var(--sub);font-weight:500}
.form label{display:block;font-size:12.5px;color:var(--sub);margin:8px 0 3px}
.mat{display:grid;grid-template-columns:1fr 70px 36px;gap:6px;margin-bottom:6px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
details summary{cursor:pointer;color:var(--blue)}
.small{font-size:12px;color:var(--sub)}
.right{text-align:right}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -12px 8px;padding:0 12px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border-radius:99px;padding:6px 12px;font-size:13.5px;background:var(--panel2);color:var(--sub);border:1px solid var(--line)}
.chip.on{background:var(--gold);color:#1a1405;border-color:var(--gold);font-weight:600}
.chips.sub .chip{padding:4px 10px;font-size:12.5px}
.chips.sub .chip.on{background:transparent;color:var(--gold)}
.hd{display:flex;gap:10px;align-items:center;min-width:0}
.ic{flex:none;width:44px;height:44px;border-radius:8px;background:var(--panel2);border:1px solid var(--line);display:grid;place-items:center;font-size:22px}
.star{flex:none;border:0;background:transparent;font-size:22px;line-height:1;padding:2px 4px;color:var(--sub)}
.star.on{color:var(--gold)}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-bottom:10px}
.seg button{flex:1;border:0;border-radius:0;background:var(--panel2);color:var(--sub);padding:7px 4px;font-size:13.5px}
.seg button.on{background:var(--gold);color:#1a1405;font-weight:600}
/* 詳細シート */
#sheet{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.55);display:none}
#sheet.open{display:block}
#sheet .body{position:absolute;left:0;right:0;bottom:0;top:6vh;background:var(--bg);border-radius:16px 16px 0 0;border-top:1px solid var(--line);overflow-y:auto;padding:14px 14px 40px;max-width:760px;margin:0 auto}
#sheet .close{position:sticky;top:0;float:right;font-size:18px;padding:4px 10px;z-index:2}
svg.chart{width:100%;height:190px;display:block}
.legend{display:flex;gap:12px;font-size:12px;color:var(--sub);margin-top:4px}
.legend i{display:inline-block;width:10px;height:3px;border-radius:2px;vertical-align:middle;margin-right:4px}
.kpi{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:8px 0}
.kpi div{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px 8px}
.kpi b{display:block;font-size:16px}
.kpi span{font-size:11.5px;color:var(--sub)}
</style>
</head>
<body>
<header>
  <div class="top">
    <h1>AION2 利益ファインダー</h1>
    <select id="server" aria-label="サーバー"></select>
  </div>
  <div class="meta" id="meta">読み込み中…</div>
  <nav id="tabs">
    <button data-tab="flip">転売</button>
    <button data-tab="move">値動き</button>
    <button data-tab="sell">売り時</button>
    <button data-tab="log">取引メモ</button>
    <button data-tab="craft">製作</button>
    <button data-tab="quna">クーナ</button>
    <button data-tab="settings">設定</button>
  </nav>
</header>
<main id="main"></main>
<div id="sheet"><div class="body" id="sheetBody"></div></div>
<datalist id="itemlist"></datalist>

<script>
"use strict";
// ── 保存 ──────────────────────────────────────────────
const LS = {
  get(k, d){ try{ const v = localStorage.getItem("a2pf."+k); return v==null ? d : JSON.parse(v); }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem("a2pf."+k, JSON.stringify(v)); }catch(e){} }
};
const DEFAULTS = { tax:10, fee:2, minSold:3, minProfit:5000, minMargin:5, conservative:true, flipSort:"daily", yenPerQuna:"", staleDays:3 };
let S = Object.assign({}, DEFAULTS, LS.get("settings", {}));
let INDEX = null, DATA = null, ITEMS = [], BYKEY = {}, TAB = LS.get("tab", "flip");
let NAMES_NC = {}, NAMES_JA = {};
let RECIPES = LS.get("recipes", null);
let CAT = LS.get("cat", {sec:"", c:""});
let CHESTS = LS.get("chests", [[400000,185],[2000000,930],[10000000,4998]]);
let FAVS = LS.get("favs", {});          // {itemKey: true}
let MANUAL = LS.get("manual", {});      // {"server:item": {last, avg, lo, hi, at}}
let OFFICIAL = LS.get("official", {});  // {itemKey: 正式名}
let TRADES = LS.get("trades", []);      // [{id, sid, k, type:"buy"|"sell", qty, price, at, extra, note}]
let UI = Object.assign({flipManualOnly:false, moveDir:"down", moveBasis:"ch24", logRange:"7", logView:"sum"}, LS.get("ui", {}));
const saveUI = () => LS.set("ui", UI);
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const SID = () => String($("#server").value || "");

// ── 書式 ──────────────────────────────────────────────
function kina(n){
  if(n == null || !isFinite(n)) return "—";
  const a = Math.abs(n), sign = n < 0 ? "-" : "";
  if(a >= 1e8) return sign + (a/1e8).toFixed(a>=1e9?1:2).replace(/\.?0+$/,"") + "億";
  if(a >= 1e4) return sign + (a/1e4).toFixed(a>=1e6?0:1).replace(/\.0$/,"") + "万";
  return sign + Math.round(a).toLocaleString("ja-JP");
}
const full = n => n == null || !isFinite(n) ? "—" : Math.round(n).toLocaleString("ja-JP");
const signed = n => n == null || !isFinite(n) ? "—" : (n>0?"+":"") + kina(n);
const pct = (x, d=0) => x == null || !isFinite(x) ? "—" : (x>0?"+":"") + (x*100).toFixed(d) + "%";
const cls = x => x > 0 ? "up" : x < 0 ? "down" : "";
function ago(ts){
  if(!ts) return "不明";
  const m = Math.round((Date.now() - new Date(ts).getTime())/60000);
  if(m < 60) return Math.max(0,m) + "分前";
  if(m < 48*60) return Math.round(m/60) + "時間前";
  return Math.round(m/1440) + "日前";
}
function dt(ts){ const d = new Date(ts); return `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`; }
const netRate = () => 1 - S.tax/100 - S.fee/100;
const toKata = s => String(s||"").replace(/[ぁ-ゖ]/g, c => String.fromCharCode(c.charCodeAt(0)+0x60));
const parseNum = v => { const n = parseFloat(String(v||"").replace(/[,，\s]/g,"")); return isFinite(n) ? n : null; };

// ── カテゴリー ─────────────────────────────────────────
const SEC_JA = {"Weapons":"武器","Armor":"防具","Accessories":"アクセサリー","Materials":"素材","Consumables & collectibles":"消耗品","Skins":"スキン","Other":"その他"};
const SEC_ICON = {"Weapons":"⚔️","Armor":"🛡️","Accessories":"💍","Materials":"🪨","Consumables & collectibles":"🧪","Skins":"👘","Other":"📦"};
const CAT_JA = {"Boots":"靴","Breastplates":"胴","Cloaks":"マント","Helms":"兜","Pauldrons":"肩","Greaves":"脚","Gloves":"手袋","Earrings":"イヤリング","Necklaces":"ネックレス","Rings":"指輪","Belts":"ベルト","Bracelets":"ブレスレット","Bows":"弓","Daggers":"短剣","Greatswords":"大剣","Guards":"盾","Shields":"盾","Longswords":"長剣","Swords":"剣","Maces":"メイス","Orbs":"宝珠","Spellbooks":"魔導書","Staves":"杖","Polearms":"槍","Amplify stones":"増幅石","Armor skins":"防具スキン","Accessory skins":"アクセサリースキン","Weapon skins":"武器スキン","Accessories":"アクセサリー","Artwork":"アートワーク","Crafting materials":"製作素材","Gathered resources":"採集物","Food":"料理","Manastones & soulstones":"魔石・霊石","Potions & serums":"ポーション・秘薬","Sealed wings":"封印された翼","Transformation candy":"変身キャンディ","Wings":"翼","Other items":"その他","Other":"その他"};
const secJa = v => SEC_JA[v] || v || "その他";
const catJa = v => CAT_JA[v] || v || "";
function inCat(it){
  if(CAT.sec === "★") return !!FAVS[it.k];
  return (!CAT.sec || it.sec === CAT.sec) && (!CAT.c || it.c === CAT.c);
}
function catBar(){
  const secs = [], seen = {};
  for(const it of ITEMS){ const k = it.sec || "Other"; if(!seen[k]){ seen[k]=1; secs.push(k); } }
  const order = Object.keys(SEC_JA), ix = k => { const i = order.indexOf(k); return i<0 ? 99 : i; };
  secs.sort((a,b)=>ix(a)-ix(b));
  const nf = ITEMS.filter(it=>FAVS[it.k]).length;
  let h = `<div class="chips"><button class="chip ${CAT.sec?"":"on"}" data-sec="">すべて</button>` +
    `<button class="chip ${CAT.sec==="★"?"on":""}" data-sec="★">★ お気に入り${nf?" "+nf:""}</button>` +
    secs.map(k=>`<button class="chip ${CAT.sec===k?"on":""}" data-sec="${esc(k)}">${SEC_ICON[k]||""} ${esc(secJa(k))}</button>`).join("") + `</div>`;
  if(CAT.sec && CAT.sec !== "★"){
    const cs = [];
    for(const it of ITEMS) if(it.sec===CAT.sec && it.c && !cs.includes(it.c)) cs.push(it.c);
    if(cs.length > 1) h += `<div class="chips sub"><button class="chip ${CAT.c?"":"on"}" data-c="">すべて</button>` +
      cs.map(c=>`<button class="chip ${CAT.c===c?"on":""}" data-c="${esc(c)}">${esc(catJa(c))}</button>`).join("") + `</div>`;
  }
  return h;
}

// ── 名前 ──────────────────────────────────────────────
// 表示名の優先順：自分で入れた正式名 → NC公式の日本語名 → 直訳 → 英語名
function applyNames(it){
  it.off = OFFICIAL[it.k] || NAMES_NC[it.k] || null;
  it.tr = NAMES_JA[it.k] || null;
  it.n = it.off || it.tr || it.en;
}
function nameHtml(it){ return esc(it.n) + (!it.off && it.tr ? `<span class="tr">直訳</span>` : ""); }
function subHtml(it){ return (it.n !== it.en ? esc(it.en) + " ・ " : "") + esc(catJa(it.c)); }
function matchQ(it, q){
  if(!q) return true;
  const kq = toKata(q.toLowerCase());
  return [it.off, it.tr, it.en, catJa(it.c)].some(v => v && toKata(String(v).toLowerCase()).includes(kq));
}

// ── 部品 ──────────────────────────────────────────────
function spark(sp){
  if(!sp || sp.filter(v=>v!=null).length < 2) return "";
  const v = sp.filter(x=>x!=null), lo = Math.min(...v), hi = Math.max(...v), W = 300, H = 34, n = sp.length;
  let d = "", pen = false;
  sp.forEach((y,i)=>{
    if(y == null){ pen = false; return; }
    const X = (i/(n-1))*W, Y = hi===lo ? H/2 : H-3 - (y-lo)/(hi-lo)*(H-6);
    d += (pen ? "L" : "M") + X.toFixed(1) + " " + Y.toFixed(1); pen = true;
  });
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"><path d="${d}" fill="none" stroke="var(--blue)" stroke-width="1.6" vector-effect="non-scaling-stroke"/></svg>`;
}
const iconOf = it => `<span class="ic">${SEC_ICON[it.sec]||"📦"}</span>`;
const starBtn = it => `<button class="star ${FAVS[it.k]?"on":""}" data-star="${esc(it.k)}" aria-label="お気に入り">${FAVS[it.k]?"★":"☆"}</button>`;
function head(it, right){
  return `<div class="row"><div class="hd">${iconOf(it)}<div><div class="name">${nameHtml(it)}</div><div class="cat">${subHtml(it)}</div></div></div>
    <div style="display:flex;gap:4px;align-items:flex-start"><div class="right">${right||""}</div>${starBtn(it)}</div></div>`;
}
const salesLabel = it => it.est ? "24h売れ数(推定)" : "24h販売";

// ── 手入力 ─────────────────────────────────────────────
const mkey = k => SID() + ":" + k;
function manualOf(it){
  const m = MANUAL[mkey(it.k)];
  if(!m || !m.last) return null;
  const days = (Date.now() - new Date(m.at).getTime())/86400000;
  return Object.assign({}, m, {days, stale: days >= S.staleDays});
}
function manualTag(it){
  const m = manualOf(it);
  if(!m) return FAVS[it.k] ? `<span class="tag">手入力なし</span>` : "";
  return m.stale ? `<span class="tag warn">手入力 ${ago(m.at)}・要更新</span>` : `<span class="tag gold">手入力 ${ago(m.at)}</span>`;
}

// ── 計算 ──────────────────────────────────────────────
// 売れる見込み価格：手入力（ゲーム内の取引価格）があればそれ、なければ24h相場と7日中央値
function refPrice(it){
  const m = manualOf(it);
  if(m){
    const c = [m.last, m.avg].filter(v => v > 0);
    return { v: S.conservative ? Math.min(...c) : m.last, src: "手入力" };
  }
  const c = [it.a, it.m7].filter(v => v != null && v > 0);
  if(!c.length) return null;
  return { v: S.conservative ? Math.min(...c) : (it.a || it.m7), src: "推定" };
}
function flipOf(it){
  if(!it.p) return null;
  const r = refPrice(it);
  if(!r) return null;
  const profit = r.v*netRate() - it.p;
  return { ref: r.v, src: r.src, profit, margin: profit/it.p, daily: profit*Math.min(it.s||1, 20) };
}

// ── データ ────────────────────────────────────────────
async function getJSON(path){
  const r = await fetch(path + (path.includes("?")?"&":"?") + "v=" + Math.floor(Date.now()/300000), {cache:"no-store"});
  if(!r.ok) throw new Error(path + " " + r.status);
  return r.json();
}
async function boot(){
  try{ INDEX = await getJSON("data/index.json"); }
  catch(e){ $("#meta").textContent = "データがまだありません（収集を一度実行してください）"; INDEX = {servers:[], all_servers:[]}; }
  try{ NAMES_NC = await getJSON("data/names.json"); }catch(e){ NAMES_NC = {}; }
  try{ NAMES_JA = await getJSON("data/names_ja.json"); }catch(e){ NAMES_JA = {}; }
  if(INDEX.defaults && !LS.get("settings", null)){
    S.tax = Math.round(INDEX.defaults.tax_rate*1000)/10; S.fee = Math.round(INDEX.defaults.fee_rate*1000)/10;
  }
  if(RECIPES == null){
    try{ RECIPES = await getJSON("recipes.json"); }catch(e){ RECIPES = []; }
    if(!Array.isArray(RECIPES)) RECIPES = [];
  }
  const sel = $("#server");
  sel.innerHTML = (INDEX.servers||[]).map(s=>`<option value="${esc(s.server_id)}">${esc(s.name)}${s.faction?"・"+esc(s.faction):""}</option>`).join("") || `<option value="">サーバー未設定</option>`;
  const saved = LS.get("server", null);
  if(saved && [...sel.options].some(o=>o.value==saved)) sel.value = saved;
  sel.onchange = () => { LS.set("server", sel.value); loadServer(); };
  document.querySelectorAll("#tabs button").forEach(b => b.onclick = () => { TAB = b.dataset.tab; LS.set("tab", TAB); render(); window.scrollTo(0,0); });
  $("#sheet").onclick = e => { if(e.target.id === "sheet") closeSheet(); };
  await loadServer();
}
async function loadServer(){
  const sid = SID();
  if(!sid){ DATA = null; ITEMS = []; BYKEY = {}; $("#meta").textContent = "config.json にサーバーを設定してください（設定タブに一覧あり）"; render(); return; }
  try{ DATA = await getJSON(`data/s/${sid}.json`); }
  catch(e){ DATA = null; ITEMS = []; BYKEY = {}; $("#meta").textContent = "このサーバーのデータを読めませんでした"; render(); return; }
  ITEMS = DATA.items || [];
  for(const it of ITEMS){ it.en = it.n; applyNames(it); }
  BYKEY = Object.fromEntries(ITEMS.map(i=>[i.k,i]));
  refreshDatalist();
  $("#meta").textContent = `相場 ${ago(DATA.captured_at)}の値 ・ ${ITEMS.length}品目 ・ 出典 aion2.exchange（非公式）`;
  render();
}
function refreshDatalist(){
  $("#itemlist").innerHTML = ITEMS.map(i=>`<option value="${esc(i.n)} #${esc(i.k)}">${i.n!==i.en?esc(i.en):""}</option>`).join("");
}
function pickKey(v){
  const m = String(v||"").match(/#([^#\s]+)\s*$/);
  if(m && BYKEY[m[1]]) return m[1];
  const t = String(v||"").trim();
  const hit = ITEMS.find(i => i.n === t || i.en === t);
  return hit ? hit.k : null;
}
const labelOf = k => BYKEY[k] ? `${BYKEY[k].n} #${k}` : (k||"");

// ── 画面：転売 ───────────────────────────────────────
function viewFlip(){
  const rows = [];
  for(const it of ITEMS){
    if(!inCat(it)) continue;
    if(UI.flipManualOnly && !manualOf(it)) continue;
    const f = flipOf(it);
    if(!f) continue;
    const hasManual = f.src === "手入力";
    if(!hasManual && (it.s||0) < S.minSold) continue;
    if(f.profit < S.minProfit || f.margin < S.minMargin/100) continue;
    rows.push([it, f]);
  }
  const key = {daily:r=>r[1].daily, unit:r=>r[1].profit, margin:r=>r[1].margin}[S.flipSort] || (r=>r[1].daily);
  rows.sort((a,b)=>(!!FAVS[b[0].k]-!!FAVS[a[0].k]) || key(b)-key(a));
  let h = `<p class="hint">今の最安出品を買い、売値の目安で出し直したときに、税${S.tax}%・出品手数料${S.fee}%を引いても利益が残るもの。ゲーム内の取引価格を手入力した品は、その値で計算します。</p>
  ${catBar()}<div class="bar"><select id="flipSort">
    <option value="daily">並び：売れ数込みの利益見込み</option><option value="unit">並び：1個あたり利益</option><option value="margin">並び：利益率</option>
  </select><button id="flipManual" class="${UI.flipManualOnly?"primary":""}" style="flex:none">手入力済みのみ</button></div>`;

// ── 取引メモ ──────────────────────────────────────────
// 売却の手取り＝価格×数量×(1−税)−出品手数料（価格×数量×手数料率）−追加費用。利益は移動平均の取得単価で計算
function ledger(sid){
  const pos = {}, out = [];
  const list = TRADES.filter(t => String(t.sid) === String(sid)).sort((a,b)=>new Date(a.at)-new Date(b.at));
  for(const t of list){
    const p = pos[t.k] || (pos[t.k] = {qty:0, cost:0});
    if(t.type === "buy"){
      const amt = t.price*t.qty + (t.extra||0);
      p.cost += amt; p.qty += t.qty;
      out.push(Object.assign({}, t, {amount:-amt}));
    }else{
      const tax = t.price*t.qty*(t.tax ?? S.tax)/100, fee = t.price*t.qty*(t.fee ?? S.fee)/100;
      const net = t.price*t.qty - tax - fee - (t.extra||0);
      const unit = p.qty > 0 ? p.cost/p.qty : 0, used = Math.min(t.qty, p.qty);
      const costOut = unit*used;
      p.cost -= costOut; p.qty -= used;
      out.push(Object.assign({}, t, {amount:net, tax, fee, profit: net - costOut, noCost: used < t.qty}));
    }
  }
  return {pos, rows: out};
}
function holdQty(k){ return (ledger(SID()).pos[k]||{}).qty || 0; }
function holdCost(k){ const p = ledger(SID()).pos[k]; return p && p.qty>0 ? p.cost/p.qty : null; }
function saveTrades(){ LS.set("trades", TRADES); }

  h += `</div>`;
  return h;
}

function craftCalc(r){
  const out = BYKEY[r.output?.key];
  let cost = r.extra || 0, matSell = 0; const missing = [];
  for(const m of r.materials||[]){
    const it = BYKEY[m.key];
    if(!it || !it.p){ missing.push(it ? it.n : m.key); continue; }
    cost += it.p*m.qty; matSell += it.p*m.qty*netRate();
  }
  if(!out || !out.p) missing.push(out ? out.n : "完成品");
  const outQty = r.output?.qty || 1;
  const rp = out ? (refPrice(out)?.v || out.p) : null;
  const revenue = rp ? Math.min(rp, out.p ? out.p-1 : rp)*outQty*netRate() : null;
  return { out, cost, matSell, revenue, profit: revenue==null?null:revenue-cost, vsSell: revenue==null?null:revenue-(matSell+(r.extra||0)), missing };
}

    <div class="two"><div>${num("sMinProfit","1個あたり利益の下限",S.minProfit,"1000")}</div><div>${num("sStale","手入力を古いとみなす日数",S.staleDays)}</div></div>
    <label><input id="sCons" type="checkbox" ${S.conservative?"checked":""} style="width:auto"> 慎重モード（売値は複数の目安のうち低いほうで計算）</label>
    <div class="bar" style="margin-top:10px"><button class="primary" id="sSave">保存</button><button id="sReset">初期値に戻す</button></div>
  </div>
  <div class="card form"><div class="name">データの書き出し・読み込み</div>
    <p class="small">お気に入り・手入力の値・正式名・取引メモ・レシピをまとめて移せます。機種変更や別の端末で使うときに。</p>
    <div class="bar"><button id="xCopy">書き出し（コピー）</button><button id="xShow">読み込む</button></div>
    <textarea id="xJson" rows="4" style="display:none;font:12px monospace" placeholder="書き出した内容を貼り付け"></textarea>
    <button id="xLoad" class="primary" style="display:none;margin-top:6px;width:100%">この内容で上書き</button>
  </div>
  <div class="card"><div class="name">サーバー一覧（config.json の servers に名前かIDを入れる）</div>
    <table><tr><th>名前</th><th>リージョン</th><th>ID</th></tr>
    ${(INDEX?.all_servers||[]).map(s=>`<tr><td>${esc(s.name)}${s.faction?"・"+esc(s.faction):""}</td><td>${esc(s.region||"")}</td><td>${esc(s.server_id)}</td></tr>`).join("") || `<tr><td colspan="3">一覧がまだありません</td></tr>`}
    </table><p class="small">データ生成：${INDEX?.generated_at ? ago(INDEX.generated_at) : "—"}。価格は出品中の最安値の観測値で、成約価格ではありません。このサーバーには販売統計がないため、「売れ数」は1時間ごとの出品数の減少から推定しています（取り下げも含みます）。</p></div>`;
}

// ── 詳細シート ───────────────────────────────────────
let SHEET_KEY = null;
async function openSheet(k){
  const it = BYKEY[k]; if(!it) return;
  SHEET_KEY = k;
  $("#sheet").classList.add("open"); document.body.classList.add("lock");
  renderSheet(null);
  try{ const d = await getJSON(`data/s/${SID()}/${k}.json`); if(SHEET_KEY === k) renderSheet(d.h || []); }
  catch(e){ if(SHEET_KEY === k) renderSheet([]); }
}
function closeSheet(){ SHEET_KEY = null; $("#sheet").classList.remove("open"); document.body.classList.remove("lock"); render(); }
function bigChart(h){
  if(!h || h.filter(r=>r[1]).length < 2) return `<div class="empty">履歴がまだありません。</div>`;
  const W = 340, H = 190, P = {l:44, r:30, t:8, b:22};
  const xs = h.map(r=>r[0]), x0 = Math.min(...xs), x1 = Math.max(...xs);
  const ps = h.filter(r=>r[1]).map(r=>r[1]), lo = Math.min(...ps), hi = Math.max(...ps);
  const ls = h.map(r=>r[2]||0), lmax = Math.max(1, ...ls);
  const X = t => P.l + (x1===x0 ? 0 : (t-x0)/(x1-x0)*(W-P.l-P.r));
  const Y = v => P.t + (hi===lo ? (H-P.t-P.b)/2 : (1-(v-lo)/(hi-lo))*(H-P.t-P.b));
  const YL = v => H-P.b - v/lmax*(H-P.t-P.b)*0.35;
  let bars = "", d = "", pen = false, prev = null;
  const bw = Math.max(1, (W-P.l-P.r)/Math.max(24, (x1-x0+1)) - 0.5);
  for(const [t,p,l] of h){
    bars += `<rect x="${(X(t)-bw/2).toFixed(1)}" y="${YL(l||0).toFixed(1)}" width="${bw.toFixed(1)}" height="${(H-P.b-YL(l||0)).toFixed(1)}" fill="var(--line)"/>`;
    if(!p || (prev!=null && t-prev>3)){ pen = false; }
    if(p){ d += (pen?"L":"M") + X(t).toFixed(1) + " " + Y(p).toFixed(1); pen = true; prev = t; }
  }
  const ticks = [lo, (lo+hi)/2, hi].map(v=>`<text x="${P.l-4}" y="${(Y(v)+4).toFixed(1)}" text-anchor="end" font-size="10" fill="var(--sub)">${kina(v)}</text><line x1="${P.l}" x2="${W-P.r}" y1="${Y(v).toFixed(1)}" y2="${Y(v).toFixed(1)}" stroke="var(--line)" stroke-dasharray="2 3"/>`).join("");
  const days = []; for(let t = Math.ceil(x0/24)*24; t <= x1; t += 24) days.push(t);
  const dl = days.map(t=>{ const dd = new Date(t*3600000); return `<text x="${X(t).toFixed(1)}" y="${H-6}" text-anchor="middle" font-size="10" fill="var(--sub)">${dd.getMonth()+1}/${dd.getDate()}</text>`; }).join("");
  const last = h.filter(r=>r[1]).slice(-1)[0];
  return `<svg class="chart" viewBox="0 0 ${W} ${H}">${bars}${ticks}${dl}
    <text x="${W-P.r+4}" y="${(YL(lmax)+4).toFixed(1)}" font-size="10" fill="var(--sub)">${lmax}</text>
    <path d="${d}" fill="none" stroke="var(--blue)" stroke-width="1.8"/>
    <circle cx="${X(last[0]).toFixed(1)}" cy="${Y(last[1]).toFixed(1)}" r="3" fill="var(--gold)"/></svg>
    <div class="legend"><span><i style="background:var(--blue)"></i>最安値（1時間ごと）</span><span><i style="background:var(--line);height:8px"></i>出品数</span></div>`;
}
function renderSheet(h){
  const it = BYKEY[SHEET_KEY]; if(!it) return;
  const m = MANUAL[mkey(it.k)] || {}, f = flipOf(it), mine = ledger(SID()).rows.filter(r=>r.k===it.k).reverse();
  const hq = holdQty(it.k), hc = holdCost(it.k);
  $("#sheetBody").innerHTML = `<button class="close" id="shClose">✕</button>
    ${head(it, "")}
    <div class="kpi">
      <div><span>今の最安</span><b>${kina(it.p)}</b></div>
      <div><span>7日中央値</span><b>${kina(it.m7)}</b></div>
      <div><span>${it.est?"24h売れ数(推定)":"24h販売"}</span><b>${full(it.s)}</b></div>
      <div><span>出品数</span><b>${full(it.l)}</b></div>
      <div><span>7日の最安〜最高</span><b style="font-size:13px">${kina(it.lo7)}〜${kina(it.hi7)}</b></div>
      <div><span>転売の利益/個</span><b class="${cls(f?.profit)}">${f?signed(f.profit):"—"}</b></div>
    </div>
    ${h===null ? `<div class="empty">グラフを読み込み中…</div>` : bigChart(h)}
    ${hq>0?`<div class="card" style="margin-top:10px">保有 <b>${hq}</b>個 ・ 平均取得 ${full(hc)} ・ 今売ると <b class="${cls((Math.max(1,it.p-1)*netRate()-hc)*hq)}">${signed((Math.max(1,it.p-1)*netRate()-hc)*hq)}</b></div>`:""}
    <div class="card form" style="margin-top:10px"><div class="name">📝 ゲーム内の値を記録</div>
      <p class="small">マーケットの購入画面に出る値を写してください。${m.at?`前回：${ago(m.at)}`:""}</p>
      <div class="two"><div><label>直近の取引価格</label><input id="mLast" inputmode="numeric" value="${m.last||""}"></div>
      <div><label>28日平均</label><input id="mAvg" inputmode="numeric" value="${m.avg||""}"></div></div>
      <div class="two"><div><label>28日の最安</label><input id="mLo" inputmode="numeric" value="${m.lo||""}"></div>
      <div><label>28日の最高</label><input id="mHi" inputmode="numeric" value="${m.hi||""}"></div></div>
      <label>正式名（ゲーム内の日本語名。入れると直訳と置き換わります）</label><input id="mName" value="${esc(OFFICIAL[it.k]||"")}" placeholder="${esc(it.tr||it.en)}">
      <div class="bar" style="margin-top:8px"><button class="primary" id="mSave">保存</button>${m.at?`<button id="mClear">値を消す</button>`:""}</div>
    </div>
    <div class="card"><div class="name">取引メモ</div>
      <div class="bar" style="margin-top:6px"><button id="qBuy">今の最安で買った</button><button id="qSell">売れた</button></div>
      ${mine.length?`<table>${mine.slice(0,10).map(r=>`<tr><td><span class="tag ${r.type==="buy"?"":"good"}">${r.type==="buy"?"買い":"売り"}</span> ${dt(r.at)}</td><td>×${r.qty}</td><td>${full(r.price)}</td><td class="${cls(r.profit)}">${r.type==="sell"?signed(r.profit):""}</td></tr>`).join("")}</table>`:`<p class="small">この品の記録はまだありません。</p>`}
    </div>`;
  bindAll($("#sheetBody"));
  $("#shClose").onclick = closeSheet;
  $("#mSave").onclick = () => {
    const last = parseNum($("#mLast").value), avg = parseNum($("#mAvg").value), lo = parseNum($("#mLo").value), hi = parseNum($("#mHi").value);
    const nm = $("#mName").value.trim();
    if(nm) OFFICIAL[it.k] = nm; else delete OFFICIAL[it.k];
    LS.set("official", OFFICIAL);
    if(last || avg){
      if(!last){ alert("直近の取引価格を入れてください"); return; }
      MANUAL[mkey(it.k)] = {last, avg, lo, hi, at:new Date().toISOString()};
      LS.set("manual", MANUAL);
    }
    applyNames(it); refreshDatalist();
    renderSheet(h);
    $("#mSave").textContent = "保存しました";
  };
  const mc = $("#mClear"); if(mc) mc.onclick = () => { delete MANUAL[mkey(it.k)]; LS.set("manual", MANUAL); renderSheet(h); };
  const go = type => { closeSheet(); TAB = "log"; LS.set("tab", TAB); LS.set("tradeEdit", null);
    LS.set("tradePref", {type, k:it.k, qty:1, price: type==="buy" ? (it.p||"") : (manualOf(it)?.last || (it.p?it.p-1:""))}); render(); $("#tradeBox").open = true; $("#tPrice").focus(); };
  $("#qBuy").onclick = () => go("buy");
  $("#qSell").onclick = () => go("sell");
}

// ── 描画とイベント ───────────────────────────────────
function render(){
  document.querySelectorAll("#tabs button").forEach(b=>b.classList.toggle("on", b.dataset.tab===TAB));
  const m = $("#main");
  if(TAB !== "quna" && TAB !== "settings" && !DATA){ m.innerHTML = `<div class="empty">データがありません。設定タブでサーバー一覧を確認し、config.json に自分のサーバーを入れてください。</div>`; return; }
  m.innerHTML = {flip:viewFlip, move:viewMove, sell:viewSell, log:viewLog, craft:viewCraft, quna:viewQuna, settings:viewSettings}[TAB]();
  bindAll(m); bindTab();
}
function bindAll(root){
  root.querySelectorAll("[data-star]").forEach(b=>b.onclick=e=>{
    e.stopPropagation(); const k = b.dataset.star;
    if(FAVS[k]) delete FAVS[k]; else FAVS[k] = true;
    LS.set("favs", FAVS); b.classList.toggle("on", !!FAVS[k]); b.textContent = FAVS[k] ? "★" : "☆";
  });
  root.querySelectorAll("[data-open]").forEach(c=>c.onclick=e=>{ if(e.target.closest("button,input,select,a")) return; openSheet(c.dataset.open); });
  root.querySelectorAll("[data-sec]").forEach(b=>b.onclick=()=>{ CAT = {sec:b.dataset.sec, c:""}; LS.set("cat",CAT); render(); });
  root.querySelectorAll("[data-c]").forEach(b=>b.onclick=()=>{ CAT.c = b.dataset.c; LS.set("cat",CAT); render(); });
}
function saveSettings(){ LS.set("settings", S); }
function bindTab(){
  const fs = $("#flipSort"); if(fs){ fs.value = S.flipSort; fs.onchange = () => { S.flipSort = fs.value; saveSettings(); render(); }; }
  const fm = $("#flipManual"); if(fm) fm.onclick = () => { UI.flipManualOnly = !UI.flipManualOnly; saveUI(); render(); };
  document.querySelectorAll("[data-dir]").forEach(b=>b.onclick=()=>{ UI.moveDir = b.dataset.dir; saveUI(); render(); });
  document.querySelectorAll("[data-basis]").forEach(b=>b.onclick=()=>{ UI.moveBasis = b.dataset.basis; saveUI(); render(); });
  document.querySelectorAll("[data-range]").forEach(b=>b.onclick=()=>{ UI.logRange = b.dataset.range; saveUI(); render(); });
  const sq = $("#sellQ"); if(sq){ let t; sq.oninput = () => { clearTimeout(t); t = setTimeout(()=>{ LS.set("sellQ", sq.value); const pos = sq.selectionStart; render(); const n=$("#sellQ"); n.focus(); n.setSelectionRange(pos,pos); }, 300); }; }
  // 取引メモ
  const pref = LS.get("tradePref", null);
  if(pref && $("#tradeForm")){ LS.set("tradePref", null); $("#tradeForm").outerHTML = tradeForm(pref); }
  bindTradeForm();
  document.querySelectorAll("[data-tdel]").forEach(b=>b.onclick=()=>{ if(confirm("この記録を削除しますか？")){ TRADES = TRADES.filter(t=>t.id!==b.dataset.tdel); saveTrades(); render(); } });
  document.querySelectorAll("[data-tedit]").forEach(b=>b.onclick=()=>{ LS.set("tradeEdit", b.dataset.tedit); render(); $("#tradeBox").scrollIntoView({behavior:"smooth"}); });
  // 製作
  document.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{ if(confirm("このレシピを削除しますか？")){ RECIPES.splice(+b.dataset.del,1); LS.set("recipes",RECIPES); LS.set("editing",null); render(); } });
  document.querySelectorAll("[data-edit]").forEach(b=>b.onclick=()=>{ LS.set("editing", +b.dataset.edit); render(); });
  const am = $("#rAddMat"); if(am) am.onclick = () => { const d = document.createElement("div"); d.className="mat"; d.innerHTML=`<input class="mName" list="itemlist" placeholder="素材名"><input class="mQty" type="number" min="1" value="1"><button class="mDel" type="button">×</button>`; $("#rMats").appendChild(d); bindMatDel(); };
  bindMatDel();
  const rc = $("#rCancel"); if(rc) rc.onclick = () => { LS.set("editing", null); render(); };
  const rs = $("#rSave"); if(rs) rs.onclick = () => {
    const outKey = pickKey($("#rOut").value);
    if(!outKey){ alert("完成品を候補から選んでください"); return; }
    const mats = [], bad = [];
    document.querySelectorAll("#rMats .mat").forEach(row=>{
      const v = row.querySelector(".mName").value.trim(); if(!v) return;
      const k = pickKey(v), q = Math.max(1, parseInt(row.querySelector(".mQty").value)||1);
      if(k) mats.push({key:k, qty:q}); else bad.push(v);
    });
    if(bad.length){ alert("候補にない素材があります：" + bad.join("、")); return; }
    if(!mats.length){ alert("素材を1つ以上入れてください"); return; }
    const rec = { name: $("#rName").value.trim(), output:{key:outKey, qty:Math.max(1,parseInt($("#rOutQty").value)||1)}, materials:mats, extra: Math.max(0, parseFloat($("#rExtra").value)||0) };
    const ed = LS.get("editing", null);
    if(ed != null && RECIPES[ed]) RECIPES[ed] = rec; else RECIPES.push(rec);
    LS.set("recipes", RECIPES); LS.set("editing", null); render();
  };
  // クーナ
  document.querySelectorAll(".cK,.cQ").forEach(inp=>inp.onchange=()=>{ const i=+inp.dataset.i, v=parseFloat(inp.value); if(v>0){ CHESTS[i][inp.classList.contains("cK")?0:1]=v; LS.set("chests",CHESTS); render(); } });
  const ca = $("#cAdd"); if(ca) ca.onclick = () => { CHESTS.push([1000000, 500]); LS.set("chests",CHESTS); render(); };
  const cd = $("#cDel"); if(cd) cd.onclick = () => { if(CHESTS.length>1){ CHESTS.pop(); LS.set("chests",CHESTS); render(); } };
  const y = $("#yen"); if(y) y.onchange = () => { S.yenPerQuna = y.value; saveSettings(); render(); };
  // 設定
  const ss = $("#sSave"); if(ss) ss.onclick = () => {
    const g = id => parseFloat($(id).value);
    S.tax = g("#sTax"); S.fee = g("#sFee"); S.minSold = g("#sMinSold"); S.minMargin = g("#sMinMargin"); S.minProfit = g("#sMinProfit"); S.staleDays = g("#sStale");
    for(const k of ["tax","fee","minSold","minMargin","minProfit","staleDays"]) if(!isFinite(S[k])) S[k] = DEFAULTS[k];
    S.conservative = $("#sCons").checked; saveSettings(); ss.textContent = "保存しました"; setTimeout(()=>render(), 700);
  };
  const sr = $("#sReset"); if(sr) sr.onclick = () => { const y = S.yenPerQuna; S = Object.assign({}, DEFAULTS, {yenPerQuna:y}); saveSettings(); render(); };
  const xc = $("#xCopy"); if(xc) xc.onclick = async () => {
    const data = JSON.stringify({v:1, favs:FAVS, manual:MANUAL, official:OFFICIAL, trades:TRADES, recipes:RECIPES, chests:CHESTS});
    try{ await navigator.clipboard.writeText(data); xc.textContent = "コピーしました"; }
    catch(e){ const t = $("#xJson"); t.style.display = "block"; t.value = data; t.select(); xc.textContent = "表示した内容をコピーしてください"; }
  };
  const xs = $("#xShow"); if(xs) xs.onclick = () => { $("#xJson").style.display = "block"; $("#xJson").value = ""; $("#xLoad").style.display = "block"; $("#xJson").focus(); };
  const xl = $("#xLoad"); if(xl) xl.onclick = () => {
    try{
      const d = JSON.parse($("#xJson").value);
      if(!d || typeof d !== "object") throw 0;
      if(!confirm("今のお気に入り・手入力・取引メモ・レシピを、この内容で上書きします。よろしいですか？")) return;
      if(d.favs) FAVS = d.favs; if(d.manual) MANUAL = d.manual; if(d.official) OFFICIAL = d.official;
      if(Array.isArray(d.trades)) TRADES = d.trades; if(Array.isArray(d.recipes)) RECIPES = d.recipes; if(Array.isArray(d.chests)) CHESTS = d.chests;
      LS.set("favs",FAVS); LS.set("manual",MANUAL); LS.set("official",OFFICIAL); saveTrades(); LS.set("recipes",RECIPES); LS.set("chests",CHESTS);
      for(const it of ITEMS) applyNames(it); refreshDatalist();
      xl.textContent = "読み込みました"; setTimeout(render, 700);
    }catch(e){ alert("内容の形式が正しくありません"); }
  };
}
function bindTradeForm(){
  const f = $("#tradeForm"); if(!f) return;
  f.querySelectorAll("[data-ttype]").forEach(b=>b.onclick=()=>{
    const cur = readTrade(true); cur.type = b.dataset.ttype; f.outerHTML = tradeForm(cur); bindTradeForm();
  });
  const pv = () => {
    const t = readTrade(true); let s = "";
    if(t.qty && t.price){
      if(t.type==="buy") s = `支払い ${full(t.price*t.qty + (t.extra||0))} キナ`;
      else s = `手取り ${full(t.price*t.qty*netRate() - (t.extra||0))} キナ（税${S.tax}%・手数料${S.fee}%を差し引き）`;
    }
    $("#tPreview").textContent = s;
  };
  ["#tQty","#tPrice","#tExtra"].forEach(id=>{ const e = $(id); if(e) e.oninput = pv; });
  pv();
  $("#tSave").onclick = () => {
    const t = readTrade(false); if(!t) return;
    const i = TRADES.findIndex(x=>x.id===t.id);
    if(i>=0) TRADES[i] = t; else TRADES.push(t);
    saveTrades(); LS.set("tradeEdit", null); render();
  };
  const c = $("#tCancel"); if(c) c.onclick = () => { LS.set("tradeEdit", null); render(); };
}
function readTrade(loose){
  const k = pickKey($("#tItem").value), qty = Math.max(1, parseInt($("#tQty").value)||1), price = parseNum($("#tPrice").value);
  const atv = $("#tAt").value, at = atv ? new Date(atv).toISOString() : new Date().toISOString();
  const t = {id: $("#tId").value || ("t"+Date.now().toString(36)+Math.random().toString(36).slice(2,6)), sid: SID(), k: k || "", type: $("#tType").value, qty, price: price ?? "", extra: parseNum($("#tExtra").value) || 0, at};
  if(t.type === "sell"){ t.tax = S.tax; t.fee = S.fee; }
  if(loose) return t;
  if(!k){ alert("アイテムを候補から選んでください"); return null; }
  if(!price || price <= 0){ alert("単価を入れてください"); return null; }
  return t;
}
function bindMatDel(){ document.querySelectorAll(".mDel").forEach(b=>b.onclick=()=>{ const rows=document.querySelectorAll("#rMats .mat"); if(rows.length>1) b.parentElement.remove(); else b.parentElement.querySelector(".mName").value=""; }); }
boot();
</script>
